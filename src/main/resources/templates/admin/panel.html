<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Panel de Solicitudes</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        h1 { color: #333; }
        .indicadores { display: flex; gap: 16px; margin-bottom: 30px; flex-wrap: wrap; }
        .card { background: white; border-radius: 8px; padding: 20px 30px; box-shadow: 0 2px 6px rgba(0,0,0,.1); text-align: center; min-width: 120px; }
        .card h2 { margin: 0; font-size: 2.5rem; }
        .card p { margin: 5px 0 0; color: #666; }
        .total h2 { color: #333; }
        .pendiente h2 { color: #f39c12; }
        .aprobada h2 { color: #27ae60; }
        .rechazada h2 { color: #e74c3c; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,.1); }
        th { background: #333; color: white; padding: 12px 16px; text-align: left; }
        td { padding: 10px 16px; border-bottom: 1px solid #eee; }
        .badge { padding: 4px 10px; border-radius: 12px; font-size: .8rem; font-weight: bold; }
        .badge-PENDIENTE { background: #fef3cd; color: #856404; }
        .badge-APROBADA  { background: #d4edda; color: #155724; }
        .badge-RECHAZADA { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
<h1>Panel de Solicitudes</h1>
<div class="indicadores">
    <div class="card total"><h2 th:text="${total}">0</h2><p>Total</p></div>
    <div class="card pendiente"><h2 th:text="${pendientes}">0</h2><p>Pendientes</p></div>
    <div class="card aprobada"><h2 th:text="${aprobadas}">0</h2><p>Aprobadas</p></div>
    <div class="card rechazada"><h2 th:text="${rechazadas}">0</h2><p>Rechazadas</p></div>
</div>
<table>
    <thead>
        <tr><th>Usuario</th><th>Tipo</th><th>Estado</th><th>Fecha Creación</th><th>Observación</th></tr>
    </thead>
    <tbody>
        <tr th:each="s : ${solicitudes}">
            <td th:text="${s.solicitanteUsername}"></td>
            <td th:text="${s.tipo}"></td>
            <td><span th:text="${s.estado}" th:class="|badge badge-${s.estado}|"></span></td>
            <td th:text="${#temporals.format(s.fechaCreacion, 'dd/MM/yyyy HH:mm')}"></td>
            <td th:text="${s.observacion != null ? s.observacion : '-'}"></td>
        </tr>
    </tbody>
</table>
</body>
</html>
